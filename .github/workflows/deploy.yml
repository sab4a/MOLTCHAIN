name: Deploy to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'moltchain-node/**'
      - 'Dockerfile'
      - 'fly.toml'

jobs:
  deploy:
    name: Deploy Moltchain Node
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          
      - name: Verify Deployment
        run: |
          sleep 10
          curl -s https://moltchain-rpc.fly.dev \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"moltchain_status","params":[]}' \
            | jq .result

  # Build and release binaries for agents to download
  release-binary:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: deploy
    if: startsWith(github.event.head_commit.message, 'release:') || contains(github.event.head_commit.message, '[release]')
    
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: moltchain-linux-x64
          - target: aarch64-unknown-linux-gnu
            name: moltchain-linux-arm64
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          
      - name: Build binary
        run: |
          cd moltchain-node
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/moltchain ../${{ matrix.name }}
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
